# (C) Sergio Alejandro Gómez
# Conda environment of the genetics analyses (R 4.5.1 and Python 3.10, linux-64).
# Create it with strict channel priority, then run the pinned post-install step once inside it:
#     mamba env create --strict-channel-priority -f workflow/envs/genetics.yaml
#     conda activate genetics
#     Rscript workflow/envs/genetics_postinstall.R
# Two steps because bioconda has no Bioconductor 3.21 builds for R 4.5 (chromVAR 1.30.1, motifbreakR 2.22.0,
# MotifDb 1.50.0, BSgenome.Hsapiens.UCSC.hg38 1.4.5 and the core GenomicRanges stack exist there only for R <= 4.4), so the
# Bioconductor packages, gchromVAR and the development version of susieR are installed by the post-install script.
# The versions are those of the workstation run that produced the published results.
name: genetics
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.1
  # CRAN packages with an R 4.5 build at the version used
  - r-data.table=1.17.8
  - r-digest=0.6.38
  - r-jsonlite=2.0.0
  - r-dplyr=1.2.1
  - r-tfmpvalue=1.0.0
  - r-ggplot2=4.0.3
  - r-r.utils=2.13.0        # lets data.table::fread read .gz files
  # installers used by the post-install step only
  - r-remotes=2.5.0
  - r-biocmanager=1.30.26
  # toolchain and system libraries for the source builds of the post-install step
  - compilers
  - make
  - pkg-config
  - zlib
  - bzip2
  - xz
  - libcurl
  - openssl
  - libxml2
  - gsl
  - libpng
  - libiconv
  - cairo                   # cairo_pdf / png(type = "cairo") of the figures
  # Python for reading the h5ad (01_export_peak_matrix.py)
  - python=3.10.16
  - numpy=1.26.4
  - h5py=3.12.1
